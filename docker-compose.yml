services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iscuissatis}
      POSTGRES_USER: ${POSTGRES_USER:-iscuissatis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection:-Host=db;Port=5432;Database=iscuissatis;Username=iscuissatis;Password=${POSTGRES_PASSWORD}}
      Security__UseHttpsRedirection: "false"
      Database__MigrateOnStartup: "true"
      Seed__AdminEmail: ${Seed__AdminEmail:-admin@exemplo.com.br}
      Seed__AdminPassword: ${Seed__AdminPassword:?defina Seed__AdminPassword no .env}
      Seed__AdminFullName: ${Seed__AdminFullName:-Administrador}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  postgres-data:
